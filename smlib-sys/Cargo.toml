[package]
name = "smlib-sys"
version = "0.1.1"
description = "Builds SMLib and SM_API, the NURBS B-rep kernel from NVIDIA's usd-brep, with a C interface, and links them (unofficial)"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
links = "smlib"
build = "build.rs"

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
