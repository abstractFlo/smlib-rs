name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      # the crash tests 50 times more: a Windows run of 0.1.3 crashed in them once (0xc0000005)
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          for i in $(seq 50); do
            cargo test --release -q -p smlib --test crashes || { echo "crashed in run $i of 50"; exit 1; }
          done
      - run: cargo run --release --example drilled_box

  threads:
    name: threads (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: tools/threads/run.sh release 1,2,4 1
      # writable globals against allowed.txt; GNU objdump, so Linux only
      - if: runner.os == 'Linux'
        run: tools/threads/run.sh globals

  ios:
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p smlib --target aarch64-apple-ios
      - run: cargo build --release -p smlib --target aarch64-apple-ios-sim

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p smlib --target wasm32-unknown-emscripten

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package -p smlib-sys
